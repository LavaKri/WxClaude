[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wxclaude"
version = "0.1.0"
description = "Screen-reader-friendly desktop front end for the Claude Code CLI (claude -p)."
requires-python = ">=3.14"
dependencies = [
    "wxPython>=4.3",
    "platformdirs>=4",
    "markdown-it-py>=3",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "Babel",
    "pyinstaller",
]

[project.gui-scripts]
wxclaude = "wxclaude.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wxclaude = ["locale/*/LC_MESSAGES/*.mo", "data/*.txt", "help/*.html", "sounds/*.wav"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF",
    # Structure and size of the code (thresholds: ruff defaults, see docs/working-rules.md)
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLC0415", "BLE001", "ERA001", "PTH", "PERF", "RET", "TRY203", "TRY300", "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# Other dialogs and windows still take many labels and names; group them in a data object (see
# docs/working-rules.md, "Grouping arguments") as `ListDialog` does, then drop this exception.
"src/wxclaude/ui/*" = ["PLR0913"]
"tests/*" = ["PLR0913"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["wxclaude.core.*", "wxclaude.presenters.*"]
strict = true

[[tool.mypy.overrides]]
module = "wxclaude.ui.*"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["wx", "wx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# faulthandler prints a harmless first-chance COM exception (0x8001010d) raised by wx while it
# dispatches the events posted by the runner threads
addopts = "-ra -p no:faulthandler"
markers = [
    "unit: fast tests of pure logic (no wx)",
    "ui: tests that create wx windows",
    "slow: tests with large inputs",
]
